name: Deploy Spring Boot to AWS ECR and Private EC2 via Bastion

on:
  push:
    branches:
      - jason_test  # jason_test 브랜치에 푸시될 때 실행

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 코드 체크아웃 (실행 안됨)
      - name: Checkout repository
        if: true
        uses: actions/checkout@v4

      # 2️⃣ JDK 21 설치 (실행 안됨)
      - name: Set up JDK 21
        if: true
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3️⃣ Gradle 실행 권한 부여 (실행 안됨)
      - name: Grant execute permission for Gradlew
        if: true
        run: chmod +x gradlew

      # 4️⃣ Spring Boot 애플리케이션 빌드 (실행 안됨)
      - name: Build Spring Boot application
        if: true
        run: ./gradlew clean build -x test

      # 5️⃣ AWS 로그인 설정 (실행 안됨)
      - name: Configure AWS credentials
        if: true
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 6️⃣ Docker 로그인 (ECR) (실행 안됨)
      - name: Login to Amazon ECR
        if: true
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY }}

      # 7️⃣ Docker 이미지 빌드 & 태깅 (실행 안됨)
      - name: Build Docker Image
        if: true
        run: |
          docker buildx build --platform linux/amd64 -t ${{ secrets.ECR_REPOSITORY }}:spring-boot-2 .

      # 8️⃣ ECR에 Docker 이미지 Push (실행 안됨)
      - name: Push Docker Image to Amazon ECR
        if: true
        run: |
          docker push ${{ secrets.ECR_REPOSITORY }}:spring-boot-2

      # Github Action에서 원격 서버의 SSH 호스트 키를 인식하기 위한 과정
      - name: Add SSH Key to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.BASTION_HOST }} >> ~/.ssh/known_hosts || true
          ssh-keyscan -H ${{ secrets.PRIVATE_INSTANCE_IP }} >> ~/.ssh/known_hosts || true

      # 9️⃣ SSH 에이전트 설정 (Bastion 및 Private EC2 접근용)
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Private EC2 via Bastion
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPO: ${{ secrets.ECR_REPOSITORY }}
        run: |
          ssh -A \
            -o StrictHostKeyChecking=no \
            -J ec2-user@${{ secrets.BASTION_HOST }} ubuntu@${{ secrets.PRIVATE_INSTANCE_IP }} <<EOF
              echo "Deploying Docker container on private EC2 instance..."
              sudo docker stop springboot || true
              sudo docker rm springboot || true
              sudo aws ecr get-login-password --region $AWS_REGION | \
                sudo docker login --username AWS --password-stdin \$(echo \$ECR_REPO | cut -d'/' -f1)
              sudo docker pull \$ECR_REPO:spring-boot-2
              sudo docker run -d --name springboot -p 8080:8080 \$ECR_REPO:spring-boot-2
          EOF
      
          
